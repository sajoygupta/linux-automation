---
- name: Automated Enterprise Server Hardening
  hosts: servers
  become: yes
  tasks:

    - name: Install Fail2ban & Firewalld
      package:
        name:
          - fail2ban
          - firewalld
          - curl
          - git
        state: present

    - name: Ensure Fail2ban & Firewalld are running
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - fail2ban
        - firewalld

    - name: Allow essential services through Firewalld
      firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - ssh
        - http
        - https
